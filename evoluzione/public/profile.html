<!DOCTYPE html>
<html lang="it" class="page-scroll-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profilo giocatore</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="page-scroll-body">
  <main class="screen-view screen-view--sub profile-public-page" style="display:flex;">
    <button type="button" class="subview-round-back subview-bar-back--center js-no-start" id="btn-public-back" aria-label="Torna alla home" title="Home">⌂</button>
    <h2 class="view-title">PROFILO PUBBLICO</h2>
    <p class="profile-info"><span id="public-profile-name">...</span></p>
    <div class="profile-layout">
      <section class="profile-panel">
        <h3 class="profile-panel-title">Statistiche</h3>
        <div class="profile-stats-hero">
          <div id="public-profile-stats-best-card" class="profile-stats-best profile-stats-hero__card"></div>
          <div class="profile-stats-best profile-stats-hero__card profile-stats-hero__card--level">
            <span class="profile-stats-best-label">Livello</span>
            <span id="public-profile-level-badge" class="profile-stats-best-value">LV 0</span>
          </div>
        </div>
        <div id="public-profile-stats-grid" class="profile-stats-grid"></div>
        <div class="profile-soglie-block">
          <div id="public-profile-threshold-legend" class="profile-threshold-legend" aria-label="Traguardi di tempo"></div>
          <div class="profile-threshold-rows">
            <div class="profile-threshold-row">
              <p class="profile-threshold-row__label profile-info--dim">Totale</p>
              <div id="public-profile-runs-over-grid" class="profile-color-stats profile-threshold-stats profile-threshold-row__values" aria-label="Partite oltre il traguardo"></div>
            </div>
            <div class="profile-threshold-row">
              <p class="profile-threshold-row__label profile-info--dim">Traguardi<br>attuali</p>
              <div id="public-profile-streaks-grid" class="profile-color-stats profile-threshold-stats profile-threshold-row__values" aria-label="Traguardi consecutivi attuali"></div>
            </div>
            <div class="profile-threshold-row">
              <p class="profile-threshold-row__label profile-info--dim">Migliori<br>serie</p>
              <div id="public-profile-best-streaks-grid" class="profile-color-stats profile-threshold-stats profile-threshold-row__values" aria-label="Migliori serie consecutive"></div>
            </div>
          </div>
          <p class="profile-threshold-help profile-info--dim">Conta solo la serie consecutiva di partite che superano quel tempo.</p>
        </div>
        <p class="profile-panel-note profile-info--dim profile-stats-subhead">Bonus raccolti (totale)</p>
        <div class="profile-color-stats">
          <div class="profile-color-stat profile-color-stat--red"><span class="profile-color-dot"></span><span id="public-red">0</span></div>
          <div class="profile-color-stat profile-color-stat--blue"><span class="profile-color-dot"></span><span id="public-blue">0</span></div>
          <div class="profile-color-stat profile-color-stat--yellow"><span class="profile-color-dot"></span><span id="public-yellow">0</span></div>
          <div class="profile-color-stat profile-color-stat--green"><span class="profile-color-dot"></span><span id="public-green">0</span></div>
          <div class="profile-color-stat profile-color-stat--purple"><span class="profile-color-dot"></span><span id="public-purple">0</span></div>
        </div>
      </section>
    </div>
    <p id="public-profile-msg" class="profile-msg"></p>
  </main>
  <script type="module" src="/js/profile-public.js"></script>
</body>
</html>
