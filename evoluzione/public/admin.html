<!DOCTYPE html>
<html lang="it" class="admin-html page-scroll-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Admin - DODGE</title>
  <!-- Gate UX: schermo bianco finché admin.js non verifica auth + ruolo (overlay sotto). -->
  <style>
    html[data-admin-gate="pending"],
    html[data-admin-gate="pending"] body.admin-body {
      background: #000 !important;
      margin: 0;
      min-height: 100%;
    }
  </style>
  <link rel="stylesheet" href="/css/style.css?v=20260509a">
</head>
<body class="admin-body page-scroll-body">
  <script>
    document.documentElement.setAttribute('data-admin-gate', 'pending');
  </script>
  <!-- Copre tutto finché il modulo non completa i check (evita flash del layout admin). -->
  <div id="admin-auth-blocking" style="position:fixed;inset:0;z-index:2147483647;background:#000;" aria-hidden="true"></div>
  <div class="admin-page-shell">
  <main class="admin-scroll-outer">
    <div class="admin-scroll-inner admin-view">
    <h2 class="view-title">PANNELLO ADMIN</h2>

    <section id="admin-section-overview" class="admin-section">
      <div class="admin-card-grid" id="admin-kpi-grid"></div>
      <div class="admin-panel">
        <h3 class="admin-panel-title">Distribuzione tempi (giocatori)</h3>
        <p class="profile-info profile-info--dim admin-panel-hint">Quanti account hanno un best time ≥ soglia (da <code>player_stats</code>), non singole run.</p>
        <div id="admin-distribution" class="admin-list"></div>
      </div>
      <div class="admin-panel">
        <h3 class="admin-panel-title">Top 10 corrente</h3>
        <div id="admin-top10" class="admin-list"></div>
      </div>
      <div class="admin-panel admin-actions">
        <button id="btn-admin-open-players" class="home-btn js-no-start" type="button">Vai a /admin/players</button>
        <button id="btn-export-players" class="home-btn js-no-start" type="button">Export CSV stats giocatori</button>
        <div class="admin-inline">
          <select id="export-games-days" class="profile-display-input js-no-start">
            <option value="7">7 giorni</option>
            <option value="30">30 giorni</option>
            <option value="90">90 giorni</option>
            <option value="all">all</option>
          </select>
          <button id="btn-export-games" class="home-btn home-btn--compact js-no-start" type="button">Export partite</button>
        </div>
      </div>
    </section>

    <section id="admin-section-players" class="admin-section" hidden>
      <div class="admin-panel admin-actions">
        <div class="admin-inline">
          <input id="admin-search" class="profile-display-input js-no-start" type="text" placeholder="Cerca username/email" />
          <button id="btn-admin-search" class="home-btn home-btn--compact js-no-start" type="button">Cerca</button>
        </div>
        <div class="admin-inline">
          <select id="admin-sort" class="profile-display-input js-no-start">
            <option value="best_time">Best time</option>
            <option value="username">Username</option>
            <option value="email">Email</option>
            <option value="total_games">Partite</option>
            <option value="total_playtime">Tempo totale</option>
            <option value="last_login">Ultimo accesso</option>
            <option value="role">Ruolo</option>
          </select>
          <button id="btn-admin-refresh-players" class="home-btn home-btn--compact js-no-start" type="button">Aggiorna</button>
        </div>
      </div>
      <div id="admin-players-table" class="admin-table-wrap"></div>
      <p id="admin-players-pagination" class="profile-info profile-info--dim"></p>
    </section>

    <section id="admin-section-player-detail" class="admin-section" hidden>
      <div id="admin-player-detail" class="admin-panel"></div>
      <div class="admin-panel">
        <h3 class="admin-panel-title">Ultime 20 partite</h3>
        <div id="admin-player-recent-games" class="admin-table-wrap"></div>
      </div>
    </section>

    <p id="admin-msg" class="profile-msg"></p>
    </div>
  </main>

  <nav class="admin-nav-chrome" aria-label="Navigazione">
    <button type="button" class="home-bar-btn home-bar-btn--admin-blue js-no-start" id="btn-admin-dock-home" title="Home" aria-label="Home gioco">⌂</button>
    <button type="button" class="home-dock-btn js-no-start" id="btn-admin-dock-profile" aria-label="Profilo" title="Profilo">
      <svg class="home-dock-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"><circle cx="12" cy="9" r="3.2"/><path d="M6.5 19.5c0-3.2 2.7-5.2 5.5-5.2s5.5 2 5.5 5.2"/></svg>
    </button>
  </nav>
  </div>
  <script type="module" src="/js/admin.js"></script>
</body>
</html>
