<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, shrink-to-fit=no, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>DODGE</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/menu-records.css">
<link rel="stylesheet" href="css/game-hud.css">
</head>
<body>

<div id="dodgeShell" class="dodge-shell">
<canvas id="c"></canvas>

<div id="hud" class="hud--hidden">
  <span class="hud-left hud-time">TEMPO <span id="t">0:00</span></span>
  <span class="hud-center">LV <span id="lv">1</span></span>
  <span class="hud-right hud-nb"><span id="nb">0</span> oggetti</span>
</div>

<div id="green-mode-hud" aria-hidden="true">
  <div id="greenmodetrack"><div id="greenmodefill"></div></div>
</div>

<div id="pauseOverlay">PAUSA</div>

<button type="button" id="fullscreenCornerBtn" class="js-no-start" aria-pressed="false" aria-label="Tutto schermo" title="Tutto schermo">⛶</button>
<button type="button" id="audioCornerBtn" class="js-no-start" aria-pressed="true" aria-label="Audio attivo" title="Audio">♪</button>

<div id="countdownOverlay" aria-hidden="true">
  <div id="cdInner" class="cd-inner cd-r cd-popping">
    <span id="cdNum">3</span>
  </div>
</div>

<div id="shield-hud">
  <div id="strack"><div id="sfill"></div></div>
</div>
<div id="slow-hud">
  <div id="bluetrack"><div id="bluefill"></div></div>
</div>

<div id="screen">
  <header class="menu-header">
    <h1 class="menu-logo"><span class="menu-logo-text">DODGE</span></h1>
    <div class="menu-bonus-dots" aria-hidden="true">
      <span class="menu-bonus-dot menu-bonus-dot--red"></span>
      <span class="menu-bonus-dot menu-bonus-dot--blue"></span>
      <span class="menu-bonus-dot menu-bonus-dot--yellow"></span>
      <span class="menu-bonus-dot menu-bonus-dot--green"></span>
      <span class="menu-bonus-dot menu-bonus-dot--purple"></span>
    </div>
    <p class="menu-tagline">Prendi i bonus per resistere.</p>
  </header>
  <input type="text" id="playerNameInput" class="player-name-input js-no-start" maxlength="18" placeholder="Il tuo nome" autocomplete="nickname" spellcheck="false">
  <p class="tap-hint">Premi ovunque per iniziare</p>
</div>

</div>

<script type="module" src="js/game.js"></script>
</body>
</html>
